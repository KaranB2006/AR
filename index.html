<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR View</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
    }

    .qr-box {
      margin: 20px auto;
    }

    .qr-box img {
      width: 180px;
    }
  </style>
</head>

<body>

<h2>Scan to View in AR</h2>

<div class="qr-box">
  <img src="qr.png" alt="Scan for AR">
  <p>Scan this QR code on your phone</p>
</div>

<model-viewer
  src="biryani.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate>
</model-viewer>

</body>
</html>
