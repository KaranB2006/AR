<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Model View</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #f4f4f4;
    }
  </style>
</head>

<body>

<model-viewer
  src="biryani.glb"
  ios-src="biryani.usdz"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  alt="3D Biryani Model">
</model-viewer>

</body>
</html>
